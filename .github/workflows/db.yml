name: Database migrations

on:
  pull_request:
    paths:
      - "db/**"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "db/**"
      - ".github/workflows/db.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lektie
          POSTGRES_USER: lektie
          POSTGRES_PASSWORD: lektie
        options: >-
          --health-cmd "pg_isready -U lektie -d lektie"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply all migrations to an empty database
        run: >
          docker run --rm --network host
          -v "$PWD/db/migrations:/flyway/sql:ro"
          flyway/flyway:11
          -url=jdbc:postgresql://localhost:5432/lektie
          -user=lektie -password=lektie
          migrate
