# In-memory database for development. Everything is lost on restart.
# Hibernate creates the tables from the entities; the real schema is in db/migrations (see application-postgres.yml).

spring:
  datasource:
    url: jdbc:h2:mem:lektie;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

lektie:
  jwt:
    generate-keys-if-missing: true
  seed-demo-users: true
